name: EventEase CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
  pull_request:
    branches:
      - main
      - develop

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'

jobs:
  # ==========================================
  # JOB 1: BUILD AND TEST
  # ==========================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-path: |
            ~/.nuget/packages

      - name: Restore dependencies
        run: dotnet restore EventEaseApp.sln

      - name: Build solution
        run: dotnet build EventEaseApp.sln --configuration Release --no-restore

      - name: Run unit tests
        run: |
          dotnet test EventEaseApp.sln \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: ./coverage/**/*.trx

      - name: Code Coverage Report
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/**/coverage.cobertura.xml
          flags: unittests
          name: codecov-eventease
          fail_ci_if_error: false

      - name: Publish build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            **/bin/Release
            **/obj/Release

  # ==========================================
  # JOB 2: CODE QUALITY & SECURITY SCAN
  # ==========================================
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Static Code Analysis
      - name: Run .NET Code Analysis
        run: |
          dotnet build EventEaseApp.sln \
            --configuration Release \
            /p:EnableNETAnalyzers=true \
            /p:AnalysisLevel=latest \
            /p:TreatWarningsAsErrors=false

      # Security Vulnerability Scan
      - name: Run Security Scan
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee security-scan.log

      - name: Upload security scan results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-scan
          path: security-scan.log

      # Dependency Review (for PRs)
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v3

  # ==========================================
  # JOB 3: DOCKER BUILD
  # ==========================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/eventease-web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./EventEaseApp/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/eventease-web:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/eventease-web:buildcache,mode=max

      # Uncomment when API project is created
      # - name: Extract metadata for API
      #   id: meta-api
      #   uses: docker/metadata-action@v5
      #   with:
      #     images: ${{ secrets.DOCKER_USERNAME }}/eventease-api
      #     tags: |
      #       type=ref,event=branch
      #       type=semver,pattern={{version}}
      #       type=sha,prefix={{branch}}-

      # - name: Build and push API image
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     file: ./EventEaseApp.API/Dockerfile
      #     push: true
      #     tags: ${{ steps.meta-api.outputs.tags }}
      #     labels: ${{ steps.meta-api.outputs.labels }}

  # ==========================================
  # JOB 4: DEPLOY TO STAGING
  # ==========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.eventease.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Azure Deployment Example
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}

      - name: Deploy to Azure App Service (Staging)
        uses: azure/webapps-deploy@v2
        with:
          app-name: eventease-staging
          images: ${{ secrets.DOCKER_USERNAME }}/eventease-web:develop

      # Database Migration (Staging)
      - name: Run Database Migrations
        run: |
          echo "Running database migrations for staging..."
          # Add your migration command here
          # dotnet ef database update --connection "${{ secrets.STAGING_CONNECTION_STRING }}"

      - name: Smoke Tests (Staging)
        run: |
          echo "Running smoke tests against staging..."
          curl -f https://staging.eventease.com/health || exit 1

  # ==========================================
  # JOB 5: DEPLOY TO PRODUCTION
  # ==========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://eventease.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PRODUCTION }}

      - name: Deploy to Azure App Service (Production)
        uses: azure/webapps-deploy@v2
        with:
          app-name: eventease-production
          images: ${{ secrets.DOCKER_USERNAME }}/eventease-web:main

      - name: Run Database Migrations
        run: |
          echo "Running database migrations for production..."
          # Add your migration command here

      - name: Smoke Tests (Production)
        run: |
          echo "Running smoke tests against production..."
          curl -f https://eventease.com/health || exit 1

      - name: Notify Deployment Success
        if: success()
        run: |
          echo "Production deployment successful!"
          # Add Slack/Teams notification here

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "Deployment failed! Initiating rollback..."
          # Add rollback logic here

  # ==========================================
  # JOB 6: PERFORMANCE TESTS
  # ==========================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run Load Tests
        run: |
          # Create a simple k6 test script
          cat > load-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          export let options = {
            vus: 50,
            duration: '30s',
            thresholds: {
              http_req_duration: ['p(95)<500'],
            },
          };

          export default function () {
            let res = http.get('https://staging.eventease.com/');
            check(res, { 'status is 200': (r) => r.status === 200 });
            sleep(1);
          }
          EOF

          k6 run load-test.js

  # ==========================================
  # JOB 7: NOTIFICATION
  # ==========================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality, docker-build]
    if: always()

    steps:
      - name: Job Status Summary
        run: |
          echo "Build: ${{ needs.build-and-test.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"

      # Add Slack, Teams, or email notifications here
      - name: Send notification
        run: |
          echo "Pipeline completed. Add notification integration here."
